openapi: 3.0.3
info:
  title: Acceso y reventa
  version: 1.0.0
  description: Consulta de reventas para auditoría.
servers:
  - url: /
# Contrato de consumo a través del gateway del clúster.
security:
  - tokenGateway: []
paths:
  /accesos:
    post:
      operationId: registrarAcceso
      summary: Registrar un intento de ingreso (A-HU1)
      description: Guarda un intento de ingreso aceptado o rechazado con puerta y motivo. La hora (registradoEn) la asigna el servidor. Si el resultado es rechazado, el motivo es obligatorio; si es aceptado, se guarda en null.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoAcceso' }
            examples:
              rechazado:
                value: { boletaCodigo: c87979ee-e717-4631-94ca-e1007f728c77, eventoId: evt-1, puerta: A, resultado: rechazado, motivo: qr_invalido }
              aceptado:
                value: { boletaCodigo: c87979ee-e717-4631-94ca-e1007f728c77, eventoId: evt-1, puerta: B, resultado: aceptado }
      responses:
        '201':
          description: Intento registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acceso' }
        '400':
          description: Cuerpo inválido o rechazo sin motivo (solicitud_invalida).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: La boleta ya tiene un acceso aceptado (acceso_duplicado).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Error interno al registrar el intento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listarAccesos
      summary: Consultar el registro de intentos de ingreso (A-HU1)
      description: Los filtros se combinan por igualdad (AND). Se ordena del más reciente al más antiguo. Los parámetros desconocidos se rechazan.
      parameters:
        - in: query
          name: eventoId
          schema: { type: string, minLength: 1 }
        - in: query
          name: boletaCodigo
          schema: { type: string, minLength: 1 }
        - in: query
          name: resultado
          schema: { type: string, enum: [aceptado, rechazado] }
        - in: query
          name: pagina
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: tamano
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de intentos que coinciden.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAccesos' }
        '400':
          description: Filtros o paginación inválidos (solicitud_invalida).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Error interno al consultar el registro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /reventas:
    get:
      operationId: listarReventas
      summary: Consultar el historial de reventas
      description: Los filtros se combinan por igualdad (AND). Sin filtros se listan todas, de más reciente a más antigua. Los parámetros desconocidos o repetidos se rechazan.
      parameters:
        - in: query
          name: marcaSospechosa
          description: Acepta únicamente true o false en minúsculas.
          schema: { type: boolean }
        - in: query
          name: vendedorId
          description: Identificador exacto del vendedor, sin espacios exteriores.
          schema: { type: string, minLength: 1 }
        - in: query
          name: boletaCodigo
          description: Código exacto de la boleta, sin espacios exteriores.
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Reventas que coinciden. Sin coincidencias se devuelve un arreglo vacío.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reventa' }
              examples:
                sinCoincidencias: { value: [] }
                sospechosa:
                  value:
                    - id: rev-001
                      boletaCodigo: c87979ee-e717-4631-94ca-e1007f728c77
                      vendedorId: usr-3
                      compradorId: usr-9
                      precio: 90000
                      estado: bloqueada
                      marcaSospechosa: true
                      registradaEn: '2026-11-20T10:00:00Z'
        '400':
          description: Filtros inválidos (solicitud_invalida).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Error interno al consultar el historial.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    tokenGateway:
      type: http
      scheme: bearer
      description: Token que valida el gateway antes de enrutar la consulta.
  schemas:
      NuevoAcceso:
        type: object
        additionalProperties: false
        required: [boletaCodigo, eventoId, puerta, resultado]
        properties:
          boletaCodigo: { type: string, minLength: 1, maxLength: 100 }
          eventoId: { type: string, minLength: 1, maxLength: 100 }
          puerta: { type: string, minLength: 1, maxLength: 20 }
          resultado: { type: string, enum: [aceptado, rechazado] }
          motivo:
            type: string
            nullable: true
            maxLength: 200
            description: Obligatorio cuando resultado es rechazado.
      Acceso:
        type: object
        required: [id, boletaCodigo, eventoId, puerta, resultado, motivo, registradoEn]
        properties:
          id: { type: string }
          boletaCodigo: { type: string }
          eventoId: { type: string }
          puerta: { type: string }
          resultado: { type: string, enum: [aceptado, rechazado] }
          motivo: { type: string, nullable: true }
          registradoEn: { type: string, format: date-time }
      PaginaAccesos:
        type: object
        required: [items, total, pagina, tamano]
        properties:
          items:
            type: array
            items: { $ref: '#/components/schemas/Acceso' }
          total: { type: integer }
          pagina: { type: integer }
          tamano: { type: integer }
      Reventa:
        type: object
        required: [id, boletaCodigo, vendedorId, compradorId, precio, estado, marcaSospechosa, registradaEn]
        properties:
          id: { type: string }
          boletaCodigo: { type: string }
          vendedorId: { type: string }
          compradorId: { type: string }
          precio: { type: number, description: Precio en COP }
          estado: { type: string }
          marcaSospechosa: { type: boolean }
          registradaEn: { type: string, format: date-time }
      Error:
        type: object
        required: [codigo, mensaje, detalle]
        properties:
          codigo: { type: string }
          mensaje: { type: string }
          detalle: { type: object, additionalProperties: true }
